name: Build and run tests 

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_type: Debug
          - os: macos-15
            build_type: Debug

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "bin-output-dir=${{ github.workspace }}/bin" >> "$GITHUB_OUTPUT"

    - name: Install Deps
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        sudo apt-get install libopenblas-dev liblapacke-dev

    - name: Install Deps
      if: matrix.os == 'macos-15'
      shell: bash
      run: |
        brew install openblas nlopt libomp

    # Pin Xcode because macos-latest currently resolves to an Xcode 26 toolchain
    # whose GitHub runner packaging does not provide the libc++ <format> header.
    - name: Select supported Xcode
      if: matrix.os == 'macos-15'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: Configure Apple Clang
      if: matrix.os == 'macos-15'
      shell: bash
      run: |
        developer_dir="$(xcode-select -p)"
        c_compiler="$(xcrun --find clang)"
        cpp_compiler="$(xcrun --find clang++)"
        echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
        echo "CC=${c_compiler}" >> "$GITHUB_ENV"
        echo "CXX=${cpp_compiler}" >> "$GITHUB_ENV"
        echo "Using Xcode developer directory: ${developer_dir}"
        xcodebuild -version
        "${c_compiler}" --version
        "${cpp_compiler}" --version
        printf '#include <format>\nint main() { return std::format("{}", 0).size(); }\n' \
          | "${cpp_compiler}" -std=c++23 -x c++ -c -o /dev/null -

    - name: Configure CMake
      if: matrix.os != 'macos-15'
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DBUILD_TESTS=ON
        -S ${{ github.workspace }}

    - name: Configure CMake (macOS)
      if: matrix.os == 'macos-15'
      shell: bash
      run: |
        openblas_prefix="$(brew --prefix openblas)"
        libomp_prefix="$(brew --prefix libomp)"
        cmake -B "${{ steps.strings.outputs.build-output-dir }}" \
          -DCMAKE_C_COMPILER="$CC" \
          -DCMAKE_CXX_COMPILER="$CXX" \
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
          -DOpenBLAS_INCLUDE_DIRS="${openblas_prefix}/include" \
          -DOpenBLAS_LIBRARY_DIRS="${openblas_prefix}/lib" \
          -DOpenMP_CXX_FLAG="-Xclang -fopenmp" \
          -DOpenMP_CXX_INCLUDE_DIR="${libomp_prefix}/include" \
          -DOpenMP_CXX_LIB_NAMES=libomp \
          -DOpenMP_C_FLAG="-Xclang -fopenmp" \
          -DOpenMP_C_INCLUDE_DIR="${libomp_prefix}/include" \
          -DOpenMP_C_LIB_NAMES=libomp \
          -DOpenMP_libomp_LIBRARY="${libomp_prefix}/lib/libomp.dylib" \
          -DBUILD_TESTS=ON \
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Run Tests
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -t test
